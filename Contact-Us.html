        </a>
    </div>
</header>
    <main class="contact-section" >
        <form action="#" method="get" class="contact-form">
            <fieldset>
                <legend>התחלת פרויקט – תיאום פגישת הכרות וייעוץ</legend>

                <div class="form-group">
                    <label for="firstname">שם פרטי:</label>
                    <input type="text" id="firstname" name="firstname" autocomplete="given-name" required>
                </div>

                <div class="form-group">
                    <label for="lastname">שם משפחה:</label>
                    <input type="text" id="lastname" name="lastname" autocomplete="family-name" required>
                </div>

                <div class="form-group">
                    <label for="phone">טלפון להתקשרות:</label>
                    <input type="tel" id="phone" name="phone" autocomplete="tel" required>
                </div>

                <div class="form-group">
                    <label for="email">דואר אלקטרוני:</label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="city">עיר / יישוב הפרויקט:</label>
                    <input type="text" id="city" name="city">
                </div>

                <div class="form-group">
                    <label for="property-type">סוג הנכס:</label>
                    <select id="property-type" name="property_type">
                        <option value="" disabled selected>בחר/י אפשרות</option>
                        <option value="apartment">דירת מגורים</option>
                        <option value="private-house">בית פרטי / וילה</option>
                        <option value="office">משרד / חלל מסחרי</option>
                        <option value="renovation">שדרוג חלל בודד (מטבח/סלון וכו')</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="message">פרטים נוספים על הפרויקט:</label>
                    <textarea id="message" name="message" rows="5" placeholder="ספרו בקצרה על הנכס והצרכים שלכם..."></textarea>
                </div>

                <button type="submit" class="btn-submit">שליחת פנייה</button>
            </fieldset>
        </form>
   


 </main>
